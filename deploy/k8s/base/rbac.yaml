# The service creates, watches and deletes game pods, reads their logs, runs the bake
# Job, and holds each pod's token in a Secret owned by that pod (D-H5). Nothing
# cluster-wide.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: descent-service
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: descent-service
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [create, get, list, watch, delete]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create, get, delete]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, get, list, watch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: descent-service
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: descent-service
subjects:
  - kind: ServiceAccount
    name: descent-service
