# A plain registry for the local cluster, on NodePort 30500 so podman on this box pushes
# to localhost:30500 and the node's containerd pulls from the same name. Its own
# namespace: `make cluster-down` deletes `descent` and keeps the images.
apiVersion: v1
kind: Namespace
metadata:
  name: descent-registry
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: registry
  namespace: descent-registry
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 30Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: descent-registry
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: registry }
  template:
    metadata:
      labels: { app: registry }
    spec:
      containers:
        - name: registry
          image: docker.io/library/registry:2.8.3
          env:
            - { name: REGISTRY_STORAGE_DELETE_ENABLED, value: "true" }
          ports:
            - { containerPort: 5000 }
          volumeMounts:
            - { name: data, mountPath: /var/lib/registry }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: registry }
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: descent-registry
spec:
  type: NodePort
  selector: { app: registry }
  ports:
    - { port: 5000, targetPort: 5000, nodePort: 30500 }
