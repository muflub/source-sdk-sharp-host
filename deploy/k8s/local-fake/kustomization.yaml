# TIER=fake: the fake game server (Host.FakeGame) is the engine image, and the mod
# init container is skipped (§7.6). Only ever with ASPNETCORE_ENVIRONMENT=Development,
# which the service's ValidateOnStart enforces. A strategic merge: env entries merge by
# name, so EngineImage is replaced, not doubled.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../local
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata: { name: tf2-descent-service }
      spec:
        template:
          spec:
            containers:
              - name: service
                env:
                  - { name: SOURCESHARP_SERVICE_Instances__EngineImage, value: "localhost:30500/sourcesharp-fake:latest" }
                  - { name: SOURCESHARP_SERVICE_Instances__SkipModInit, value: "true" }
                  - { name: SOURCESHARP_SERVICE_Instances__RelayMode, value: "Loopback" }
                  - { name: SOURCESHARP_SERVICE_Instances__SkipLevelFetch, value: "true" }
                  - { name: SOURCESHARP_SERVICE_Instances__ExtraEnv__FAKEGAME_ControlAnyAddress, value: "true" }
                  - { name: SOURCESHARP_SERVICE_MapPool__DefaultPerDepth, value: "0" }
  # plan_steam_auth: the fake tier's gateway validates with the fake Steam (no libsteam_api, no Steam
  # account), on the toy wire the fake clients and fake game speak.
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: { name: tf2-descent-gateway }
      spec:
        template:
          spec:
            containers:
              - name: gateway
                env:
                  - { name: GATEWAY_Steam__Mode, value: "Fake" }
                  - { name: GATEWAY_Wire, value: "Toy" }
